<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>橙声音乐 · 封面/歌词切换与同步预览（Mock）</title>
<style>
:root{--bg:#0e0d16;--acc:#a78bfa;--txt:#f2f2f7;--dim:rgba(242,242,247,.55);--faint:rgba(242,242,247,.28)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1000px 500px at 30% -10%,#3a2c6e,#0e0d16 55%);
 color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:18px;display:flex;flex-direction:column;align-items:center}
.bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.bar button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--txt);padding:7px 12px;border-radius:18px;cursor:pointer;font-size:12px;min-height:36px}
.bar button.active{background:var(--acc);border-color:var(--acc);color:#fff}
.phone{width:min(100%,390px);height:760px;border-radius:30px;padding:18px;position:relative;overflow:hidden;
 background:linear-gradient(165deg,rgba(255,255,255,.10),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(22px);box-shadow:0 24px 70px rgba(0,0,0,.55)}
.phone.wide{width:min(95vw,1440px);height:800px}
.top{text-align:center;font-size:15px;font-weight:700;margin-bottom:10px}
/* 两个并列主视图：切换时整体替换内容区，而不是把歌词塞在封面下方 */
.stage{position:relative;height:calc(100% - 150px);width:100%;display:flex}
.view{width:100%;min-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* 同一时刻只展示一个主视图 */
.stage.show-lyrics .view:first-child{display:none}
.stage:not(.show-lyrics) .view:last-child{display:none}
/* 切换中间态：两页半透明叠加 */
.stage.mid .view{opacity:.5}
.stage.mid .view:first-child{display:flex;width:50%;min-width:50%}
.stage.mid .view:last-child{display:flex;width:50%;min-width:50%}
.cover{width:230px;height:230px;border-radius:20px;background:linear-gradient(135deg,#7c5cff,#2a1b5e);display:flex;align-items:center;justify-content:center;font-size:80px;box-shadow:0 12px 40px rgba(124,92,255,.35)}
.cover.spin{animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lyr{height:430px;width:100%;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
.entry{text-align:center;padding:12px 8px;margin-bottom:8px;transition:all .3s}
.entry .o{font-size:18px;font-weight:600;line-height:1.4}
.entry .t{font-size:13px;margin-top:7px;color:var(--dim);line-height:1.4}
.entry.cur .o{font-size:26px;font-weight:800;color:var(--acc);text-shadow:0 0 26px rgba(167,139,250,.5)}
.entry.cur .t{font-size:15px;color:var(--txt)}
.entry.near{opacity:.48;transform:scale(.9)}
.entry.far{opacity:.24;transform:scale(.8)}
.entry.untrans .t{font-style:italic;color:var(--faint)}
.dots{display:flex;gap:8px;justify-content:center;margin:8px 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--acc)}
.ctrl{padding:8px 12px}
.time{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px}
.barline{height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:6px;position:relative}
.barline i{display:block;height:100%;background:var(--acc);border-radius:2px}
.btns{display:flex;justify-content:center;gap:18px;margin-top:12px}
.btns button{width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:var(--txt);font-size:18px;cursor:pointer}
.btns button.play{background:var(--acc);font-size:22px}
.offset{text-align:center;font-size:11px;color:var(--dim);margin-top:6px}
/* 宽屏左右分栏 */
.phone.wide .body{display:flex;height:calc(100% - 160px);gap:24px}
.phone.wide .stage{height:100%;transform:none!important;width:38%}
.phone.wide .view{min-width:100%}
.phone.wide .lyrics-pane{flex:1;display:flex;align-items:center;justify-content:center}
.phone.wide .lyrics-pane .inner{width:min(100%,560px)}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="phone" id="phone">
  <div class="top" id="top">ただ声一つ · ロクデナシ</div>
  <div class="body" id="bodyWrap">
    <div class="stage" id="stage">
      <div class="view" id="coverView"><div class="cover spin" id="cover">🎵</div></div>
      <div class="view"><div class="lyr" id="lyr"></div></div>
    </div>
    <div class="lyrics-pane" id="lyricsPane" style="display:none"><div class="inner"><div class="lyr" id="lyrWide"></div></div></div>
  </div>
  <div class="dots"><span class="dot on" id="d0"></span><span class="dot" id="d1"></span></div>
  <div class="offset" id="offset">歌词校准 +0ms</div>
  <div class="ctrl">
    <div class="barline"><i id="prog" style="width:30%"></i></div>
    <div class="time"><span id="cur">1:00</span><span>3:20</span></div>
    <div class="btns">
      <button onclick="toast('上一首')">⏮</button>
      <button class="play" id="playbtn" onclick="togglePlay()">⏸</button>
      <button onclick="seek()">⏭</button>
    </div>
  </div>
</div>
<script>
const LINES=[
 {t:0,o:'因为你无心的三言两语',tr:'因为你无心的三言两语',st:'not_required'},
 {t:23000,o:'キリが無いけどさ',tr:'不过这事没完没了的',st:'translated'},
 {t:47000,o:'それを忘れたフリ疲れたよ',tr:'佯装遗忘一切的我 已然筋疲力竭',st:'translated'},
 {t:71000,o:'夜よ抱きしめて',tr:'夜晚啊 请拥抱我',st:'translated'},
 {t:96000,o:'今日だって笑う笑う',tr:'今天 我也会笑着度过',st:'translated'},
 {t:121000,o:'泣いちゃう僕を隠すために笑う',tr:'为了藏起泪流满面的自己而欢笑',st:'translated'},
 {t:145000,o:'言えないことは言えないで良い',tr:'说不出口的话 就不要说',st:'translated'},
 {t:170000,o:'また明日ね',tr:null,st:'untranslated'},
];
let pos=71000, playing=true, lyricsView=false, wide=false, scene='正常播放·中段';
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function renderLyrics(el){
  const cur=LINES.reduce((a,l,i)=>pos>=l.t?i:a,0);
  el.innerHTML=LINES.map((l,i)=>{
    const cls=i===cur?'cur':(Math.abs(i-cur)===1?'near':'far');
    const tr=l.st==='not_required'?'':(l.tr||'无翻译');
    return `<div class="entry ${cls} ${l.st==='untranslated'?'untrans':''}"><div class="o">${l.o}</div>${tr?`<div class="t">${tr}</div>`:''}</div>`;
  }).join('');
}
function render(){
  const bar=document.getElementById('bar');
  const scenes=['正常播放·中段','前段·开头','后段·结尾','暂停状态','seek跳转后','封面视图','歌词视图','缺译行','切换中间态'];
  bar.innerHTML=scenes.map(s=>`<button class="${s===scene?'active':''}" onclick="pick('${s}')">${s}</button>`).join('')
   +`<button class="${wide?'active':''}" onclick="toggleWide()">宽屏1440</button>`
   +`<button onclick="toggleView()">${lyricsView?'→封面':'→歌词'}</button>`;
  document.getElementById('phone').className='phone'+(wide?' wide':'');
  document.getElementById('lyricsPane').style.display=wide?'flex':'none';
  document.getElementById('stage').style.width=wide?'38%':'100%';
  const mid = scene==='切换中间态';
  document.getElementById('stage').className='stage'
    +(mid&&!wide?' mid':'')
    +(lyricsView&&!wide&&!mid?' show-lyrics':'');
  document.getElementById('d0').className='dot'+(lyricsView?'':' on');
  document.getElementById('d1').className='dot'+(lyricsView?' on':'');
  document.getElementById('playbtn').textContent=playing?'⏸':'▶';
  document.getElementById('cover').className='cover'+(playing?' spin':'');
  document.getElementById('prog').style.width=(pos/200000*100)+'%';
  document.getElementById('cur').textContent=fmt(pos);
  renderLyrics(document.getElementById('lyr'));
  renderLyrics(document.getElementById('lyrWide'));
}
function pick(s){
  scene=s;
  if(s==='正常播放·中段'){pos=71000;playing=true;lyricsView=true}
  if(s==='前段·开头'){pos=2000;playing=true;lyricsView=true}
  if(s==='后段·结尾'){pos=172000;playing=true;lyricsView=true}
  if(s==='暂停状态'){pos=71000;playing=false;lyricsView=true}
  if(s==='seek跳转后'){pos=145000;playing=true;lyricsView=true}
  if(s==='封面视图'){pos=71000;playing=true;lyricsView=false}
  if(s==='歌词视图'){pos=71000;playing=true;lyricsView=true}
  if(s==='缺译行'){pos=172000;playing=true;lyricsView=true}
  if(s==='切换中间态'){pos=71000;playing=true;lyricsView=true}
  render();
}
function toggleView(){lyricsView=!lyricsView;render()}
function toggleWide(){wide=!wide;render()}
function togglePlay(){playing=!playing;render()}
function seek(){pos=145000;render()}
function toast(m){}
render();
</script>
</body>
</html>
